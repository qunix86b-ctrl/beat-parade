<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111626"><title>비트 퍼레이드</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<section id="library" class="screen"><header><span class="brand">♫ BEAT PARADE</span><button id="settingsBtn" class="icon" aria-label="설정">⚙</button></header><div class="intro"><p class="eyebrow">손끝에서 시작되는 작은 모험</p><h1>비트 <em>퍼레이드</em><span>오늘은 어떤 이야기로 떠날까요?</span></h1></div><div class="hero"><canvas id="hero" width="900" height="430"></canvas><div class="heroText"><small>12 SONGS · ORIGINAL ARRANGEMENTS</small><h2>아는 멜로디, 새로운 모험.</h2><p>박자를 타고 이야기 속으로!</p></div></div><div class="sectionTitle"><h2>플레이리스트 <span>12</span></h2><button id="helpBtn">플레이 방법 ↗</button></div><div class="difficulty"><button data-diff="easy">산책 · EASY</button><button class="selected" data-diff="normal">모험 · NORMAL</button><button data-diff="hard">축제 · HARD</button></div><div id="songs"></div><footer>직접 편곡한 연주곡 · 오프라인 플레이 · 광고 없음<br><button id="creditsBtn">음악과 제작 정보</button></footer></section>
<section id="play" class="screen hidden"><canvas id="game"></canvas><div class="hud"><div><small>SCORE</small><strong id="score">0000000</strong></div><button id="pauseBtn" aria-label="일시정지">Ⅱ</button></div><div id="combo"></div><div id="judge"></div><div class="timingLegend"><span>초록 PERFECT</span><span>청록 GREAT</span><span>노랑 GOOD</span><span>빨강 BAD</span></div><div class="songHud"><span id="songTitle"></span><span id="remaining"></span></div><div class="progress"><i id="progress"></i></div><div id="story"></div><div id="gestureHint"></div></section>
<section id="result" class="screen hidden"><p class="eyebrow">STAGE COMPLETE</p><h1>멋진 여행이었어요!</h1><div id="grade"></div><h2 id="resultSong"></h2><div class="resultScore" id="resultScore"></div><p id="record"></p><div class="stats" id="stats"></div><button class="primary" id="retryBtn">한 번 더 플레이 ↻</button><button class="secondary" id="homeBtn">다른 이야기 고르기</button></section>
<div id="modal" class="hidden"><article><div id="modalContent"></div><button class="primary" id="closeModal">좋아요</button></article></div>
</main><script src="songs.js"></script><script src="scene.js"></script><script src="game.js"></script></body></html>
